<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030611">
  <title>Xem thử chủ đề vũ trụ lỗ đen</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh; min-height: 100svh; overflow: hidden; position: relative;
      color: #f8f4ed; font: 16px/1.5 Arial, Helvetica, sans-serif;
      background: radial-gradient(ellipse at 50% 46%, #111a34 0, #070d1d 42%, #02040b 100%);
    }

    .space, .stars, .nebula, .orbits, .photos, .vignette { position: fixed; inset: 0; pointer-events: none; }
    .space { overflow: hidden; isolation: isolate; perspective: 1300px; perspective-origin: 50% 50%; transform-style: preserve-3d; background: #02040a url("./background.svg") center / 100% 100% no-repeat; }
    .photos { transform-style: preserve-3d; }
    .stars {
      opacity: .64;
      background-image:
        radial-gradient(1px 1px at 7% 23%, #fff 98%, transparent),
        radial-gradient(1px 1px at 18% 79%, #bfd4ff 98%, transparent),
        radial-gradient(1.5px 1.5px at 31% 14%, #fff2cf 98%, transparent),
        radial-gradient(1px 1px at 47% 84%, #fff 98%, transparent),
        radial-gradient(1.5px 1.5px at 72% 21%, #fff 98%, transparent),
        radial-gradient(1px 1px at 88% 70%, #d6e3ff 98%, transparent);
      background-size: 260px 230px, 320px 280px, 390px 340px, 280px 260px, 360px 310px, 300px 270px;
      animation: star-drift 90s linear infinite;
    }
    .nebula {
      inset: -20%; opacity: .28; filter: blur(48px);
      background: radial-gradient(ellipse at 50% 50%, transparent 16%, #46326b22 24%, transparent 40%),
                  radial-gradient(ellipse at 23% 45%, #31548824, transparent 34%),
                  radial-gradient(ellipse at 77% 59%, #ae6b3520, transparent 32%);
    }
    .vignette { background: radial-gradient(ellipse at center, transparent 35%, #01030ab8 100%); }

    .orbits { z-index: 1; display: grid; place-items: center; transform-style: preserve-3d; }
    .orbit-ring {
      --radius: 25vmin; --tilt-x: 62deg; --tilt-y: 0deg;
      position: absolute; left: 50%; top: 50%; width: calc(var(--radius) * 2); height: calc(var(--radius) * 2);
      border: 1px solid #adc9ff38; border-radius: 50%; transform-style: preserve-3d;
      transform: translate(-50%, -50%) rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
      box-shadow: 0 0 18px #78a9ff0c, inset 0 0 18px #78a9ff08;
    }
    .orbit-ring::before, .orbit-ring::after {
      content: ""; position: absolute; border-radius: 50%;
      width: 5px; height: 5px; background: #ffdc91; box-shadow: 0 0 12px 4px #f6cd7880;
    }
    .orbit-ring::before { left: 18%; top: 9%; }
    .orbit-ring::after { right: 11%; bottom: 18%; width: 3px; height: 3px; }
    .orbit-ring.ring-1 { --radius: 25vmin; --tilt-x: 66deg; --tilt-y: -12deg; border-color: #e5c27870; }
    .orbit-ring.ring-2 { --radius: 40vmin; --tilt-x: 49deg; --tilt-y: 25deg; }
    .orbit-ring.ring-3 { --radius: 54vmin; --tilt-x: 72deg; --tilt-y: -28deg; border-color: #9abfff25; }

    .black-hole {
      display: none;
      position: fixed; z-index: 2; left: 50%; top: 50%; width: clamp(138px, 25vmin, 290px); aspect-ratio: 1;
      transform: translate(-50%, -50%); border-radius: 50%; isolation: isolate;
      background: radial-gradient(circle at 50% 50%, #000 0 32%, #03040b 34% 45%, transparent 47%);
      filter: drop-shadow(0 0 26px #f0a64c37);
      pointer-events: none;
    }
    .black-hole::before {
      content: ""; position: absolute; z-index: -1; inset: 17% -24%; border-radius: 50%;
      background: conic-gradient(from 15deg, transparent 0 8%, #9ad0ff 12%, #b589ff 22%, #ffbe70 33%, #fff2c3 39%, #d57aff 51%, #647dff 62%, #ffb55e 76%, transparent 88% 100%);
      filter: blur(8px); opacity: .9; transform: rotateX(72deg) rotateZ(-24deg);
      box-shadow: 0 0 24px #eea4ff8c;
      animation: disk-turn 18s linear infinite;
    }
    .black-hole::after {
      content: ""; position: absolute; inset: 18%; border-radius: 50%;
      background: radial-gradient(circle at 42% 38%, #070912 0 40%, #000 73%);
      box-shadow: 0 0 23px 8px #050611, inset 0 0 18px #36405c34;
    }
    .photo-card {
      position: absolute; left: 50%; top: 50%; width: clamp(58px, 8.4vmin, 112px);
      aspect-ratio: 1.18; overflow: hidden; border: 1px solid #d8e5ffb0;
      border-radius: 9px; background: #1b2944; box-shadow: 0 9px 25px #0009, 0 0 14px #b7d4ff35;
      transform: translate3d(-50%, -50%, 0); opacity: .96; transform-style: preserve-3d;
      backface-visibility: hidden; will-change: transform;
    }
    .photo-card img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .photo-card.fallback { border-color: #ffffff60; }
    .photo-card.fallback::before {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 68% 30%, #fff8 0 9%, transparent 10%),
                  radial-gradient(ellipse at 30% 78%, #ecbca969 0 20%, transparent 21%),
                  linear-gradient(160deg, transparent 48%, #10162b99 49% 52%, transparent 53%),
                  linear-gradient(145deg, var(--tint, #5269a8), #11182f 70%);
    }

    @keyframes disk-turn { to { transform: rotateX(72deg) rotateZ(336deg); } }
    @keyframes star-drift { to { background-position: 260px 230px, -320px 280px, 390px -340px, -280px -260px, 360px 310px, -300px 270px; } }

    @media (max-width: 600px) {
      .black-hole { width: clamp(132px, 35vmin, 210px); }
      .photo-card { width: clamp(48px, 13vmin, 70px); border-radius: 7px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="space" aria-label="Nền vũ trụ ảnh 3D">
    <div class="stars"></div>
    <div class="nebula"></div>

    <div class="orbits" aria-hidden="true">
      <div class="orbit-ring ring-1"></div>
      <div class="orbit-ring ring-2"></div>
      <div class="orbit-ring ring-3"></div>
    </div>

    <div class="black-hole" aria-hidden="true"></div>

    <div class="photos" id="photos" aria-hidden="true"></div>
    <div class="vignette"></div>
  </main>

  <script>
    (() => {
      const compact = window.matchMedia('(max-width: 600px)').matches;
      const layers = [
        { radius: .23, count: compact ? 4 : 5, speed: .000105, tiltX: 66, tiltY: -12, phase: .3 },
        { radius: .38, count: compact ? 5 : 7, speed: -.000073, tiltX: 49, tiltY: 25, phase: 1.2 },
        { radius: .52, count: compact ? 7 : 9, speed: .000047, tiltX: 72, tiltY: -28, phase: 2.0 }
      ];
      const host = document.getElementById('photos');
      const rings = [...document.querySelectorAll('.orbit-ring')];
      let photoPaths = [];
      let cards = [];
      let lastFrame = 0;
      let elapsedTime = 0;

      function makeFallback(index) {
        const card = document.createElement('div');
        card.className = 'photo-card fallback';
        card.style.setProperty('--tint', `hsl(${(index * 39 + 204) % 360} 55% 42%)`);
        return card;
      }

      function buildCards() {
        host.replaceChildren();
        cards = [];
        let index = 0;
        layers.forEach((layer, layerIndex) => {
          for (let i = 0; i < layer.count; i++, index++) {
            let card;
            if (photoPaths.length) {
              card = document.createElement('div');
              card.className = 'photo-card';
              const image = document.createElement('img');
              image.loading = 'lazy';
              image.alt = `Ảnh kỷ niệm ${index + 1}`;
              image.src = photoPaths[index % photoPaths.length];
              image.addEventListener('error', () => {
                card.classList.add('fallback');
                card.replaceChildren();
              }, { once: true });
              card.append(image);
            } else {
              card = makeFallback(index);
            }
            host.append(card);
            cards.push({ element: card, layer, layerIndex, index: i, start: (Math.PI * 2 * i / layer.count) + layer.phase });
          }
        });
      }

      async function loadManifest() {
        let repoPaths = [];
        try {
          const response = await fetch('./images.json', { cache: 'no-cache' });
          if (response.ok) {
            const data = await response.json();
            repoPaths = Array.isArray(data.images) ? data.images.filter(isImagePath) : [];
          }
        } catch (_) {
          // Mở trực tiếp bằng file:// thì trình duyệt có thể chặn fetch; khi đó dùng khung minh họa.
        }
        let paths = repoPaths;
        try {
          const savedPaths = JSON.parse(localStorage.getItem('event-orbit-paths') || '[]');
          if (Array.isArray(savedPaths) && savedPaths.length) paths = savedPaths.filter(isImagePath);
        } catch (_) { }
        applyUniversePaths(paths);

        // Load the admin-managed public GitHub image paths, if available.
        try {
          const [{ initializeApp }, { getFirestore, doc, getDoc }] = await Promise.all([
            import('https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js'),
            import('https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js')
          ]);
          const firebaseConfig = {
            apiKey: 'AIzaSyAL8w7SsKAmjF9_Am_RMXCtldk08Daj5Kk',
            authDomain: 'event-896c1.firebaseapp.com',
            projectId: 'event-896c1',
            storageBucket: 'event-896c1.firebasestorage.app',
            messagingSenderId: '717683458969',
            appId: '1:717683458969:web:d60444a971f66e4cb20908'
          };
          const app = initializeApp(firebaseConfig, 'orbit-background-settings');
          const settings = await getDoc(doc(getFirestore(app), 'settings', 'orbitPhotos'));
          const configured = settings.exists() && Array.isArray(settings.data().paths)
            ? settings.data().paths.filter(isImagePath) : [];
          if (configured.length) {
            try { localStorage.setItem('event-orbit-paths', JSON.stringify(configured)); } catch (_) { }
            applyUniversePaths(configured);
          } else {
            try { localStorage.removeItem('event-orbit-paths'); } catch (_) { }
            applyUniversePaths(repoPaths);
          }
        } catch (_) {
          // Keep using the cached list or images.json when Firestore is unavailable.
        }
      }

      function isImagePath(path) {
        return typeof path === 'string' && /^images\/[^/\\?#]+\.(?:jpg|jpeg|png|webp)$/i.test(path) && !path.includes('..');
      }

      function seededShuffle(items, seedText) {
        if (!seedText) return items.slice().sort(() => Math.random() - .5);
        let seed = 2166136261;
        for (const char of seedText) seed = Math.imul(seed ^ char.charCodeAt(0), 16777619) >>> 0;
        const random = () => {
          seed += 0x6D2B79F5;
          let value = seed;
          value = Math.imul(value ^ value >>> 15, value | 1);
          value ^= value + Math.imul(value ^ value >>> 7, value | 61);
          return ((value ^ value >>> 14) >>> 0) / 4294967296;
        };
        const result = items.slice();
        for (let i = result.length - 1; i > 0; i--) {
          const j = Math.floor(random() * (i + 1));
          [result[i], result[j]] = [result[j], result[i]];
        }
        return result;
      }

      function applyUniversePaths(paths) {
        const id = new URLSearchParams(location.search).get('id') || '';
        const photoCount = layers.reduce((sum, layer) => sum + layer.count, 0);
        const ordered = seededShuffle(paths, id);
        photoPaths = ordered.slice(0, photoCount).map(path => `./${path.split('/').map(encodeURIComponent).join('/')}`);
        buildCards();
        cacheOrbitPhotos(photoPaths);
      }

      async function cacheOrbitPhotos(paths) {
        if (!paths.length || !('serviceWorker' in navigator)) return;
        try {
          const registration = await navigator.serviceWorker.ready;
          const worker = navigator.serviceWorker.controller || registration.active;
          if (!worker) return;
          worker.postMessage({ type: 'CACHE_PHOTOS', urls: paths.map(path => new URL(path, location.href).href) });
        } catch (_) { }
      }

      function animate(time) {
        requestAnimationFrame(animate);
        if (document.hidden || time - lastFrame < 33) return;
        const elapsed = lastFrame ? Math.min(time - lastFrame, 50) : 16;
        lastFrame = time;
        elapsedTime += elapsed;
        const width = window.innerWidth;
        const height = window.innerHeight;
        const size = Math.min(width, height);
        const yaw = elapsedTime * .000055;
        const yawCos = Math.cos(yaw);
        const yawSin = Math.sin(yaw);
        const pitch = Math.sin(elapsedTime * .00018) * .07;
        const pitchCos = Math.cos(pitch);
        const pitchSin = Math.sin(pitch);
        const camera = Math.max(560, height * 1.25);

        rings.forEach((ring, ringIndex) => {
          const layer = layers[ringIndex];
          const radius = size * layer.radius;
          const baseTiltX = layer.tiltX * Math.PI / 180;
          const baseTiltY = layer.tiltY * Math.PI / 180;
          const yawDeg = yaw * 180 / Math.PI;
          const pitchDeg = pitch * 180 / Math.PI;
          ring.style.width = `${radius * 2}px`;
          ring.style.height = `${radius * 2}px`;
          ring.style.transform = `translate(-50%, -50%) rotateX(${layer.tiltX + pitchDeg}deg) rotateY(${layer.tiltY + yawDeg}deg)`;
          ring.style.setProperty('--tilt-x', `${baseTiltX}rad`);
          ring.style.setProperty('--tilt-y', `${baseTiltY}rad`);
        });

        for (const card of cards) {
          const { layer, layerIndex, start, element } = card;
          const phase = start + elapsedTime * layer.speed;
          const radius = size * layer.radius;
          const localX = radius * Math.cos(phase);
          const localY = radius * Math.sin(phase);
          const tiltX = layer.tiltX * Math.PI / 180;
          const tiltY = layer.tiltY * Math.PI / 180;

          // Tilt each orbital plane in 3D, then slowly rotate the whole photo universe.
          const planeX = localX * Math.cos(tiltY) + localY * Math.sin(tiltX) * Math.sin(tiltY);
          const planeY = localY * Math.cos(tiltX);
          const planeZ = -localX * Math.sin(tiltY) + localY * Math.sin(tiltX) * Math.cos(tiltY);
          const worldX = planeX * yawCos + planeZ * yawSin;
          const worldZ = -planeX * yawSin + planeZ * yawCos;
          const screenY = planeY * pitchCos - worldZ * pitchSin;
          const depthZ = planeY * pitchSin + worldZ * pitchCos;
          const perspectiveScale = Math.max(.58, Math.min(1.65, camera / (camera - depthZ)));
          const tangent = phase + Math.PI / 2;
          const tiltCardX = Math.sin(tangent) * 10;
          const tiltCardY = -Math.cos(tangent) * 12;

          element.style.transform = `translate3d(calc(-50% + ${(worldX * perspectiveScale).toFixed(1)}px), calc(-50% + ${(screenY * perspectiveScale).toFixed(1)}px), ${depthZ.toFixed(1)}px) scale(${perspectiveScale.toFixed(3)}) rotateX(${tiltCardX.toFixed(1)}deg) rotateY(${tiltCardY.toFixed(1)}deg)`;
          element.style.zIndex = String(1000 + layerIndex * 10 + Math.round(depthZ));
        }
      }

      buildCards();
      loadManifest();
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
