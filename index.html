<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#071526">
<title>Chúc mừng Ngày Quốc tế Nam giới 19/11</title>
<style>
:root{--gold:#f6cd78;--cream:#fff6e5}*{box-sizing:border-box}html,body{margin:0;min-height:100%;width:100%}body{min-height:100vh;min-height:100svh;overflow-x:hidden;overflow-y:auto;display:grid;place-items:center;padding:clamp(16px,4vh,36px) 20px;color:var(--cream);font-family:Arial,Helvetica,sans-serif;background:#b30000;transition:background 1.5s ease}.scene-bg{position:fixed;inset:0;top:-100%;z-index:0;background:#050c16 url("./background.svg") center/cover no-repeat;transition:top 1.5s cubic-bezier(.65,0,.35,1)}body.revealed{background:#050c16}body.revealed .scene-bg{top:0}.stars{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity 1s ease .4s;background-image:radial-gradient(1px 1px at 15% 20%,#fff 98%,transparent),radial-gradient(2px 2px at 78% 25%,#f6cd78 98%,transparent),radial-gradient(1px 1px at 63% 75%,#fff 98%,transparent),radial-gradient(1px 1px at 30% 82%,#d5e5ff 98%,transparent),radial-gradient(2px 2px at 90% 63%,#fff 98%,transparent);background-size:310px 290px}body.revealed .stars{opacity:.55}.glow{position:fixed;z-index:1;width:min(70vw,650px);aspect-ratio:1;border-radius:50%;background:#d99c3c;filter:blur(140px);opacity:0;transition:opacity 1.2s ease .5s;pointer-events:none}body.revealed .glow{opacity:.11}.photo-wall{position:fixed;inset:0;z-index:1;overflow:hidden;pointer-events:none;opacity:0;transition:opacity 1s ease .35s}.revealed .photo-wall{opacity:1}.photo-column{position:absolute;top:0;bottom:0;width:var(--tile-w);}.photo-tile{position:absolute;left:0;width:100%;height:var(--tile-h);border:1px solid #102f46;border-radius:17px;background:#ffffff24;overflow:hidden;box-shadow:0 3px 14px #0002}.photo-tile img{width:100%;height:100%;object-fit:cover;display:block}.folder-control{position:fixed;z-index:4;right:16px;top:16px;display:flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid #f6cd7866;border-radius:999px;background:#0b1b2ddd;color:#fff6e5;font:13px Arial,sans-serif;cursor:pointer;box-shadow:0 4px 18px #0004}.folder-control:hover{background:#19334a}.folder-control input{display:none}.folder-control span{color:#f6cd78}.firebase-login{position:fixed;z-index:4;right:210px;top:16px;padding:9px 13px;border:1px solid #f6cd7866;border-radius:999px;background:#0b1b2ddd;color:#fff6e5;font:13px Arial,sans-serif;cursor:pointer;display:none}.upload-status{position:fixed;z-index:4;left:50%;bottom:12px;transform:translateX(-50%);max-width:calc(100vw - 24px);padding:8px 13px;border:1px solid #f6cd784d;border-radius:999px;background:#0b1b2de8;color:#fff6e5;font:12px Arial,sans-serif;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}.upload-status.show{opacity:1}canvas{position:fixed;inset:0;z-index:3;width:100%;height:100%;pointer-events:none}main{position:relative;z-index:2;width:min(680px,100%);text-align:center;padding:clamp(28px,5vh,52px) clamp(20px,6vw,64px);border:1px solid #f6cd783d;border-radius:28px;background:linear-gradient(145deg,#152b40b8,#0c1a29c9);box-shadow:0 24px 90px #0008,inset 0 1px #ffffff12;backdrop-filter:blur(12px);opacity:0;visibility:hidden;transform:translateY(24px) scale(.97);transition:opacity 1.1s ease .65s,transform 1.2s cubic-bezier(.16,1,.3,1) .65s,visibility 0s linear 1.75s}body.revealed main{opacity:1;visibility:visible;transform:translateY(0) scale(1);transition-delay:.65s,.65s,0s}.badge{display:inline-flex;align-items:center;gap:9px;border:1px solid #f6cd7855;border-radius:999px;padding:9px 15px;color:var(--gold);font-size:12px;letter-spacing:2px;text-transform:uppercase}.symbol{margin:30px auto 20px;width:92px;height:92px;display:grid;place-items:center;border-radius:50%;border:1px solid #f6cd7870;background:radial-gradient(circle,#f6cd7820,#f6cd7805 70%);color:var(--gold);box-shadow:0 0 38px #f6cd781c}.symbol svg{width:48px;height:48px}h1{margin:0;font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-weight:700;font-size:clamp(34px,6vw,54px);line-height:1.12;letter-spacing:0}h1 span{display:block;color:var(--gold)}.message{max-width:490px;margin:22px auto 0;color:#d2dce7;font-size:clamp(15px,2.6vw,18px);line-height:1.8}.divider{width:70px;height:1px;margin:28px auto 22px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}.signature-line{margin-top:27px;color:#b9c7d8;font-size:15px;line-height:1.6}.signature{margin-top:18px;color:#91a4b8;font-size:12px;letter-spacing:1px}.signature strong{color:var(--gold);font-weight:500}@media(max-width:600px){.firebase-login{top:52px;right:10px;padding:7px 10px;font-size:10px}.photo-tile{border-radius:12px}.folder-control{top:10px;right:10px;padding:8px 10px;font-size:11px}body{place-items:start center;padding:18px 14px}main{width:100%;padding:30px 22px;border-radius:22px}.badge{font-size:10px;letter-spacing:1.5px;padding:8px 12px}.symbol{width:72px;height:72px;margin:22px auto 18px}.symbol svg{width:40px;height:40px}h1{font-size:clamp(32px,9vw,44px)}.message{font-size:16px;line-height:1.65;margin-top:18px}.divider{margin:22px auto 18px}.signature-line{margin-top:20px;font-size:14px}.signature{font-size:11px;line-height:1.7;margin-top:14px}}@media(max-height:650px) and (min-width:601px){body{place-items:start center}main{padding-top:26px;padding-bottom:26px}.symbol{margin:16px auto 12px}.divider{margin:18px auto 14px}.signature-line{margin-top:16px}.signature{margin-top:10px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="scene-bg" aria-hidden="true"></div><div id="photo-wall" class="photo-wall" aria-hidden="true"></div><div id="upload-status" class="upload-status" role="status"></div><div class="stars" aria-hidden="true"></div><div class="glow" aria-hidden="true"></div><canvas id="confetti" aria-hidden="true"></canvas>
<main>
<div class="badge">✦ &nbsp; 19 tháng 11 &nbsp; ✦</div>
<div class="symbol" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="28" r="12"/><path d="M28.5 19.5 40 8m-9 0h9v9"/></svg></div>
<h1>Ngày Quốc tế<span>Nam giới</span></h1>
<p class="message">Chúc những người đàn ông luôn mạnh khỏe, bình an, tự tin theo đuổi điều mình yêu và nhận được thật nhiều yêu thương mỗi ngày.</p>
<div class="divider"></div><div class="signature-line">Hôm nay là dịp để nói lời cảm ơn và trân trọng bạn.</div>
<div class="signature">Gửi lời chúc chân thành đến <strong>một nửa tuyệt vời của thế giới</strong></div>
</main>
<script>
const canvas=document.getElementById('confetti'),ctx=canvas.getContext('2d');let w,h,bits=[],celebrating=false,photoFiles=[],photoColumns=[];
function resize(){const dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const photoWall=document.getElementById('photo-wall'),statusEl=document.getElementById('upload-status');
function showStatus(text){statusEl.textContent=text;statusEl.classList.add('show');clearTimeout(showStatus.timer);showStatus.timer=setTimeout(()=>statusEl.classList.remove('show'),7000)}
function randomPhoto(){return photoFiles.length?photoFiles[Math.floor(Math.random()*photoFiles.length)]:null}
function setTilePhoto(tile,item){tile.replaceChildren();if(!item)return;const img=document.createElement('img');img.alt='';img.loading='lazy';img.decoding='async';img.src=item.src;tile.appendChild(img)}
function buildPhotoWall(){photoWall.innerHTML='';photoColumns=[];const mobile=innerWidth<=600,count=mobile?7:9,tileW=mobile?Math.max(54,Math.floor(innerWidth/7.4)):Math.max(76,Math.min(124,Math.floor(innerWidth/12))),tileH=mobile?Math.max(100,Math.floor(innerHeight*.16)):Math.max(118,Math.min(168,Math.floor(innerHeight*.18))),gap=12,step=tileH+gap;document.documentElement.style.setProperty('--tile-w',tileW+'px');document.documentElement.style.setProperty('--tile-h',tileH+'px');for(let c=0;c<count;c++){const col=document.createElement('div');col.className='photo-column';col.style.left=`${c*(innerWidth-tileW)/(count-1)}px`;const direction=c%2===0?-1:1,tiles=[];for(let i=0;i<Math.ceil(innerHeight/step)+3;i++){const tile=document.createElement('div');tile.className='photo-tile';const y=i*step-step;tile.style.top='0px';tile.style.transform=`translate3d(0,${y}px,0)`;setTilePhoto(tile,randomPhoto());col.appendChild(tile);tiles.push({el:tile,y})}photoWall.appendChild(col);photoColumns.push({tiles,direction,step,tileH})}}
function advancePhotoWall(){for(const col of photoColumns)for(const t of col.tiles){t.y+=col.direction*.8;if(t.y < -col.tileH-4){t.y+=col.tiles.length*col.step;replaceTile(t.el)}else if(t.y>innerHeight+4){t.y-=col.tiles.length*col.step;replaceTile(t.el)}t.el.style.transform=`translate3d(0,${t.y}px,0)`}}
function replaceTile(tile){setTilePhoto(tile,randomPhoto())}
addEventListener('resize',buildPhotoWall);buildPhotoWall();setInterval(advancePhotoWall,80);
showStatus('Kho ảnh riêng tư chưa được kết nối.');
async function loadLocalImageManifest(){try{const response=await fetch('./images.json',{cache:'no-store'});if(!response.ok)throw new Error('images.json chưa được đưa lên GitHub');const manifest=await response.json();photoFiles=(manifest.images||[]).filter(path=>typeof path==='string'&&/\.(jpg|jpeg|png|webp|heic|heif)$/i.test(path)).map(path=>({src:'./'+path.split('/').map(encodeURIComponent).join('/')}));buildPhotoWall();showStatus(photoFiles.length?`Đã nạp ${photoFiles.length} ảnh từ GitHub Pages.`:'Chưa có ảnh. Thêm ảnh vào thư mục images rồi tạo lại images.json.')}catch(error){console.warn(error);showStatus('Chưa đọc được images.json. Kiểm tra repository GitHub.')}}
loadLocalImageManifest();function startCelebration(){if(celebrating)return;celebrating=true;bits=Array.from({length:120},()=>({x:Math.random()*w,y:-Math.random()*h,r:2+Math.random()*3,v:1+Math.random()*2.5,a:Math.random()*6.28,c:['#f6cd78','#fff1c7','#8db7d9'][Math.floor(Math.random()*3)]}))}
function animate(){ctx.clearRect(0,0,w,h);if(celebrating){for(const b of bits){b.y+=b.v;b.x+=Math.sin(b.y/35)*.5;b.a+=.03;ctx.fillStyle=b.c;ctx.globalAlpha=.8;ctx.beginPath();ctx.ellipse(b.x,b.y,b.r,b.r*.55,b.a,0,Math.PI*2);ctx.fill();if(b.y>h+10){b.y=-10;b.x=Math.random()*w}}ctx.globalAlpha=1}requestAnimationFrame(animate)}animate();
// Giữ nền chờ một giây rồi chuyển cảnh và hiện lời chúc.
setTimeout(()=>{document.body.classList.add('revealed');startCelebration()},1000);
</script>
</body>
</html>
