<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071526">
    <title>event 19/11</title>
    <link rel="icon" href="./icon.ico?v=2" type="image/x-icon" sizes="any">
    <link rel="alternate icon" href="./icon.png?v=2" type="image/png">
    <style>
        :root {
            --gold: #f6cd78;
            --cream: #fff6e5
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            width: 100%
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            overflow-x: hidden;
            overflow-y: auto;
            display: grid;
            place-items: center;
            padding: clamp(16px, 4vh, 36px) 20px;
            color: var(--cream);
            font-family: Arial, Helvetica, sans-serif;
            background: #050c16;
        }

        .scene-bg {
            position: fixed;
            inset: 0;
            top: -100%;
            z-index: 0;
            background: #050c16 url("./background.svg") center/cover no-repeat;
            transition: top 1.5s cubic-bezier(.65, 0, .35, 1)
        }

        body.revealed {
            background: #050c16
        }

        body.revealed .scene-bg {
            top: 0
        }

        .stars {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease .4s;
            background-image: radial-gradient(1px 1px at 15% 20%, #fff 98%, transparent), radial-gradient(2px 2px at 78% 25%, #f6cd78 98%, transparent), radial-gradient(1px 1px at 63% 75%, #fff 98%, transparent), radial-gradient(1px 1px at 30% 82%, #d5e5ff 98%, transparent), radial-gradient(2px 2px at 90% 63%, #fff 98%, transparent);
            background-size: 310px 290px
        }

        body.revealed .stars {
            opacity: .55
        }

        .glow {
            position: fixed;
            z-index: 1;
            width: min(70vw, 650px);
            aspect-ratio: 1;
            border-radius: 50%;
            background: #d99c3c;
            filter: blur(140px);
            opacity: 0;
            transition: opacity 1.2s ease .5s;
            pointer-events: none
        }

        body.revealed .glow {
            opacity: .11
        }

        .photo-wall {
            position: fixed;
            inset: 0;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease .35s
        }

        .revealed .photo-wall {
            opacity: 1
        }

        .photo-column {
            position: absolute;
            inset: 0 auto 0 0;
            overflow: hidden;
        }

        .photo-track {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            will-change: transform;
        }

        .photo-track.moves-up {
            animation: column-up var(--duration) linear infinite;
        }

        .photo-track.moves-down {
            animation: column-down var(--duration) linear infinite;
        }

        .photo-track-group {
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .photo-track-group.photo-track-copy {
            top: var(--group-step);
        }

        .photo-tile {
            position: relative;
            flex: 0 0 auto;
            border: 1px solid #102f46;
            border-radius: 17px;
            background: #ffffff24;
            overflow: hidden;
            box-shadow: 0 3px 14px #0002;
        }

        .photo-tile img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        @keyframes column-up {
            to { transform: translate3d(0, var(--travel), 0); }
        }

        @keyframes column-down {
            from { transform: translate3d(0, var(--travel), 0); }
            to { transform: translate3d(0, 0, 0); }
        }
        canvas {
            position: fixed;
            inset: 0;
            z-index: 3;
            width: 100%;
            height: 100%;
            pointer-events: none
        }

        main {
            position: relative;
            z-index: 2;
            width: min(680px, 100%);
            text-align: center;
            padding: clamp(28px, 5vh, 52px) clamp(20px, 6vw, 64px);
            border: 1px solid #f6cd783d;
            border-radius: 28px;
            background: linear-gradient(145deg, #152b40b8, #0c1a29c9);
            box-shadow: 0 24px 90px #0008, inset 0 1px #ffffff12;
            backdrop-filter: blur(12px);
            opacity: 0;
            visibility: hidden;
            transform: translateY(24px) scale(.97);
            transition: opacity 1.1s ease .65s, transform 1.2s cubic-bezier(.16, 1, .3, 1) .65s, visibility 0s linear 1.75s
        }

        body.revealed main {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            transition-delay: .65s, .65s, 0s
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            border: 1px solid #f6cd7855;
            border-radius: 999px;
            padding: 9px 15px;
            color: var(--gold);
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase
        }

        h1 {
            margin: 0;
            font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
            font-weight: 700;
            font-size: clamp(34px, 6vw, 54px);
            line-height: 1.12;
            letter-spacing: 0
        }

        h1 span {
            display: block;
            color: var(--gold)
        }

        .message {
            max-width: 490px;
            margin: 22px auto 0;
            color: #d2dce7;
            font-size: clamp(15px, 2.6vw, 18px);
            line-height: 1.8
        }

        .divider {
            width: 70px;
            height: 1px;
            margin: 28px auto 22px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent)
        }

        .signature-line {
            margin-top: 27px;
            color: #b9c7d8;
            font-size: 15px;
            line-height: 1.6
        }

        .signature {
            margin-top: 18px;
            color: #91a4b8;
            font-size: 12px;
            letter-spacing: 1px
        }

        .signature strong {
            color: var(--gold);
            font-weight: 500
        }

        @media(max-width:600px) {
            .photo-tile {
                border-radius: 12px
            }
body {
                place-items: start center;
                padding: 18px 14px
            }

            main {
                width: 100%;
                padding: 30px 22px;
                border-radius: 22px
            }

            .badge {
                font-size: 10px;
                letter-spacing: 1.5px;
                padding: 8px 12px
            }

            h1 {
                font-size: clamp(32px, 9vw, 44px)
            }

            .message {
                font-size: 16px;
                line-height: 1.65;
                margin-top: 18px
            }

            .divider {
                margin: 22px auto 18px
            }

            .signature-line {
                margin-top: 20px;
                font-size: 14px
            }

            .signature {
                font-size: 11px;
                line-height: 1.7;
                margin-top: 14px
            }
        }

        @media(max-height:650px) and (min-width:601px) {
            body {
                place-items: start center
            }

            main {
                padding-top: 26px;
                padding-bottom: 26px
            }

            .divider {
                margin: 18px auto 14px
            }

            .signature-line {
                margin-top: 16px
            }

            .signature {
                margin-top: 10px
            }
        }

        @media(max-width:600px) { .photo-tile { border-radius: 11px; } }

        @media(prefers-reduced-motion:reduce) {
            .photo-track { animation: none !important; }

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important
            }
        }
    </style>
</head>

<body>
    <div class="scene-bg" aria-hidden="true"></div>
    <div id="photo-wall" class="photo-wall" aria-hidden="true"></div>
<div class="stars" aria-hidden="true"></div>
    <div class="glow" aria-hidden="true"></div><canvas id="confetti" aria-hidden="true"></canvas>
    <main>
        <div class="badge">✦ &nbsp; 19 tháng 11 &nbsp; ✦</div>
        <figure id="person-photo-wrap" hidden style="margin:24px auto 16px;max-width:240px">
            <img id="person-photo" alt="Ảnh người nhận lời chúc" style="display:block;width:100%;max-height:280px;object-fit:cover;border-radius:20px;border:1px solid #f6cd7855;box-shadow:0 12px 32px #0005">
        </figure>
        <h1 id="greeting-title">Ngày Quốc tế<span>Nam giới</span></h1>
        <p class="message" id="greeting-message">Chúc những người đàn ông luôn mạnh khỏe, bình an, tự tin theo đuổi điều mình yêu và nhận được
            thật nhiều yêu thương mỗi ngày.</p>
        <div class="divider"></div>
        <div class="signature-line" id="greeting-extra">Hôm nay là dịp để nói lời cảm ơn và trân trọng bạn.</div>
        <div class="signature">Gửi lời chúc chân thành đến <strong>một nửa tuyệt vời của thế giới</strong></div>
        <p id="greeting-error" role="status" hidden style="margin:22px 0 0;color:#ffd0c4"></p>
    </main>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAL8w7SsKAmjF9_Am_RMXCtldk08Daj5Kk",
            authDomain: "event-896c1.firebaseapp.com",
            projectId: "event-896c1",
            storageBucket: "event-896c1.firebasestorage.app",
            messagingSenderId: "717683458969",
            appId: "1:717683458969:web:d60444a971f66e4cb20908"
        };

        async function loadPersonalGreeting() {
            const code = new URLSearchParams(location.search).get('id');
            if (!code) return;
            document.body.classList.add('personal-view');
            document.getElementById('photo-wall').hidden = true;
            if (!/^[a-f0-9]{32}$/.test(code)) {
                showGreetingError('Mã QR không hợp lệ. Vui lòng quét lại mã được gửi cho bạn.');
                return;
            }
            try {
                const [{ initializeApp }, { getFirestore, doc, getDoc }] = await Promise.all([
                    import('https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js'),
                    import('https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js')
                ]);
                const app = initializeApp(firebaseConfig);
                const snapshot = await getDoc(doc(getFirestore(app), 'greetings', code));
                if (!snapshot.exists()) {
                    showGreetingError('Không tìm thấy lời chúc cho mã QR này. Vui lòng liên hệ người gửi.');
                    return;
                }
                const person = snapshot.data();
                document.getElementById('greeting-title').innerHTML = `Ngày Quốc tế<span>${escapeHtml(person.name || 'Nam giới')}</span>`;
                document.getElementById('greeting-message').textContent = person.message || 'Chúc bạn luôn mạnh khỏe, bình an, tự tin theo đuổi điều mình yêu và nhận được thật nhiều yêu thương mỗi ngày.';
                document.getElementById('greeting-extra').textContent = person.extra || 'Hôm nay là dịp để nói lời cảm ơn và trân trọng bạn.';
                if (person.photoPath && isGitImagePath(person.photoPath)) {
                    const photo = document.getElementById('person-photo');
                    const photoWrap = document.getElementById('person-photo-wrap');
                    photo.onload = () => { photoWrap.hidden = false; };
                    photo.onerror = () => {
                        photoWrap.hidden = true;
                        showGreetingError(`Không tải được ảnh “${person.photoPath}”. Kiểm tra tệp này đã có trên GitHub Pages chưa.`);
                        console.warn('Không tìm thấy ảnh GitHub:', person.photoPath);
                    };
                    photo.src = './' + person.photoPath.split('/').map(encodeURIComponent).join('/');
                }
                if (person.title) document.querySelector('.badge').textContent = person.title;
                document.title = `Lời chúc dành cho ${person.name || 'bạn'}`;
            } catch (error) {
                console.error('Không tải được lời chúc cá nhân.', error);
                showGreetingError('Chưa kết nối được kho lời chúc. Hãy kiểm tra mạng rồi tải lại trang.');
            }
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
        }

        function showGreetingError(message) {
            const error = document.getElementById('greeting-error');
            error.textContent = message;
            error.hidden = false;
        }

        function isGitImagePath(path) {
            return typeof path === 'string' && /^images\/[^/\\?#]+\.(?:jpg|jpeg|png|webp)$/i.test(path) && !path.includes('..');
        }

        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d', { alpha: true });
        const photoWall = document.getElementById('photo-wall');
        let width = 0, height = 0, particles = [], celebrating = false;
        let photoFiles = [], photoPool = [], photoTracks = [], currentColumnCount = 0, serviceWorkerRegistration = null;

        function isPhoneLayout() {
            return innerWidth <= 600 || (matchMedia('(pointer: coarse)').matches && Math.min(innerWidth, innerHeight) <= 600);
        }

        function resizeCanvas() {
            const mobile = isPhoneLayout();
            const dpr = Math.min(devicePixelRatio || 1, mobile ? 1.35 : 2);
            width = innerWidth;
            height = innerHeight;
            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        addEventListener('resize', resizeCanvas, { passive: true });
        resizeCanvas();

        function shuffle(items) {
            const result = items.slice();
            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }
            return result;
        }

        function getLayout() {
            const phone = isPhoneLayout();
            const columns = phone ? (innerWidth > innerHeight ? 4 : 3) : 6;
            const cellWidth = width / columns;
            const tileWidth = Math.max(70, Math.floor(cellWidth * 0.94));
            return { phone, columns, cellWidth, tileWidth, gap: Math.max(6, Math.round(cellWidth * 0.035)) };
        }

        function makeTrackPhotos(selected, columns) {
            if (!selected.length) return Array.from({ length: columns }, () => []);
            return Array.from({ length: columns }, (_, columnIndex) => {
                const track = selected.slice(columnIndex * 8, columnIndex * 8 + 8);
                if (track.length >= 8) return track;
                return Array.from({ length: 8 }, (_, index) => selected[(columnIndex * 8 + index) % selected.length]);
            });
        }

        function makeTile(photo, layout) {
            const tile = document.createElement('div');
            tile.className = 'photo-tile';
            tile.style.width = `${layout.tileWidth}px`;
            tile.style.aspectRatio = `${photo.width} / ${photo.height}`;
            const img = document.createElement('img');
            img.alt = '';
            img.decoding = 'async';
            img.loading = 'lazy';
            img.fetchPriority = 'low';
            img.draggable = false;
            img.src = photo.src;
            img.onerror = () => tile.remove();
            tile.appendChild(img);
            return tile;
        }

        function createTrackGroup(photos, layout, groupHeight) {
            const group = document.createElement('div');
            group.className = 'photo-track-group';
            group.style.gap = `${layout.gap}px`;
            let heightSoFar = 0;
            while (heightSoFar < height + 80) {
                for (const photo of photos) {
                    group.appendChild(makeTile(photo, layout));
                    heightSoFar += layout.tileWidth * photo.height / photo.width + layout.gap;
                }
            }
            groupHeight.value = heightSoFar - layout.gap;
            return group;
        }

        function buildPhotoWall() {
            const layout = getLayout();
            photoWall.replaceChildren();
            document.documentElement.style.setProperty('--tile-w', `${layout.tileWidth}px`);
            for (let columnIndex = 0; columnIndex < layout.columns; columnIndex++) {
                const photos = photoTracks[columnIndex];
                if (!photos?.length) continue;
                const column = document.createElement('div');
                column.className = 'photo-column';
                column.style.left = `${columnIndex * layout.cellWidth + (layout.cellWidth - layout.tileWidth) / 2}px`;
                column.style.width = `${layout.tileWidth}px`;
                const track = document.createElement('div');
                track.className = `photo-track ${columnIndex % 2 === 0 ? 'moves-up' : 'moves-down'}`;
                const groupHeight = { value: 0 };
                const first = createTrackGroup(photos, layout, groupHeight);
                const second = first.cloneNode(true);
                second.classList.add('photo-track-copy');
                track.append(first, second);
                const groupStep = groupHeight.value + layout.gap;
                track.style.setProperty('--group-height', `${groupHeight.value}px`);
                track.style.setProperty('--group-step', `${groupStep}px`);
                track.style.setProperty('--travel', `-${groupStep}px`);
                track.style.height = `${groupHeight.value * 2 + layout.gap}px`;
                track.style.setProperty('--duration', `${Math.max(24, groupHeight.value / 20)}s`);
                column.appendChild(track);
                photoWall.appendChild(column);
            }
        }

        async function getServiceWorker() {
            if (!('serviceWorker' in navigator)) return null;
            if (!serviceWorkerRegistration) {
                await navigator.serviceWorker.register('./service-worker.js');
                serviceWorkerRegistration = await navigator.serviceWorker.ready;
                if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
            }
            return navigator.serviceWorker.controller || serviceWorkerRegistration.active;
        }

        async function cacheWithWorker(urls) {
            const worker = await getServiceWorker();
            if (!worker) return 0;
            return new Promise(resolve => {
                const channel = new MessageChannel();
                const timeout = setTimeout(() => { channel.port1.close(); resolve(0); }, 90000);
                channel.port1.onmessage = event => {
                    clearTimeout(timeout);
                    resolve(event.data?.cached || 0);
                    channel.port1.close();
                };
                worker.postMessage({ type: 'CACHE_PHOTOS', urls }, [channel.port2]);
            });
        }

        function loadPhotoInfo(items) {
            let next = 0;
            const loaded = [];
            async function worker() {
                while (next < items.length) {
                    const item = items[next++];
                    const result = await new Promise(resolve => {
                        const image = new Image();
                        image.onload = () => resolve({ ...item, width: image.naturalWidth, height: image.naturalHeight });
                        image.onerror = () => resolve(null);
                        image.src = item.src;
                    });
                    if (result?.width && result?.height) loaded.push(result);
                }
            }
            const concurrency = isPhoneLayout() ? 2 : 4;
            return Promise.all(Array.from({ length: Math.min(concurrency, items.length) }, worker)).then(() => loaded);
        }

        async function configurePhotoTracks(columns) {
            currentColumnCount = columns;
            if (!photoFiles.length) { photoTracks = []; buildPhotoWall(); return; }
            const phone = isPhoneLayout();
            const cacheColumns = phone ? 4 : 6;
            const wanted = Math.min(photoFiles.length, Math.max(columns, cacheColumns) * 8);
            let saved = [];
            try { saved = JSON.parse(localStorage.getItem('event-photo-pool') || '[]'); } catch (_) { }
            const previous = saved.filter(src => photoFiles.some(photo => photo.src === src)).map(src => ({ src }));
            const fresh = shuffle(photoFiles).slice(0, wanted);
            let freshCached = 0;
            try { freshCached = await cacheWithWorker(fresh.map(photo => new URL(photo.src, location.href).href)); } catch (_) { }
            let chosen = freshCached === fresh.length ? fresh : previous.length >= Math.min(wanted, fresh.length) ? previous.slice(0, wanted) : fresh;
            let measured = await loadPhotoInfo(chosen);
            if (measured.length < Math.min(wanted, 8) && previous.length && chosen !== previous) {
                const oldMeasured = await loadPhotoInfo(previous.slice(0, wanted));
                if (oldMeasured.length > measured.length) measured = oldMeasured;
            }
            if (!measured.length) { photoTracks = []; buildPhotoWall(); return; }
            photoPool = measured;
            photoTracks = makeTrackPhotos(photoPool, columns);
            try { localStorage.setItem('event-photo-pool', JSON.stringify(photoPool.map(photo => photo.src))); } catch (_) { }
            buildPhotoWall();
        }

        async function loadLocalImageManifest() {
            try {
                const response = await fetch('./images.json');
                if (!response.ok) throw new Error('images.json not found');
                const manifest = await response.json();
                photoFiles = (manifest.images || [])
                    .filter(path => typeof path === 'string' && /\.(jpg|jpeg|png|webp)$/i.test(path))
                    .map(path => ({ src: './' + path.split('/').map(encodeURIComponent).join('/') }));
                configurePhotoTracks(getLayout().columns).catch(error => {
                    console.warn('Could not prepare photo tracks.', error);
                    buildPhotoWall();
                });
            } catch (error) {
                console.warn('Could not prepare photo resources.', error);
                buildPhotoWall();
            }
        }

        let resizeTimer;
        addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                resizeCanvas();
                const columns = getLayout().columns;
                if (columns !== currentColumnCount && photoFiles.length) configurePhotoTracks(columns);
                else buildPhotoWall();
            }, 220);
        }, { passive: true });

        function startCelebration() {
            if (celebrating) return;
            celebrating = true;
            const count = isPhoneLayout() ? 20 : 64;
            particles = Array.from({ length: count }, () => ({
                x: Math.random() * width, y: -Math.random() * height,
                radius: 1.5 + Math.random() * 2, speed: 1 + Math.random() * 1.8,
                angle: Math.random() * 6.28,
                color: ['#f6cd78', '#fff1c7', '#8db7d9'][Math.floor(Math.random() * 3)]
            }));
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, width, height);
            if (celebrating) {
                for (const particle of particles) {
                    particle.y += particle.speed;
                    particle.x += Math.sin(particle.y / 35) * 0.4;
                    particle.angle += 0.025;
                    ctx.fillStyle = particle.color;
                    ctx.globalAlpha = 0.75;
                    ctx.beginPath();
                    ctx.ellipse(particle.x, particle.y, particle.radius, particle.radius * 0.55, particle.angle, 0, Math.PI * 2);
                    ctx.fill();
                    if (particle.y > height + 10) { particle.y = -10; particle.x = Math.random() * width; }
                }
                ctx.globalAlpha = 1;
            }
            requestAnimationFrame(animateConfetti);
        }

        animateConfetti();
        if (new URLSearchParams(location.search).has('id')) {
            photoWall.hidden = true;
        } else {
            loadLocalImageManifest();
        }
        document.body.classList.add('revealed');
        startCelebration();
        loadPersonalGreeting();
    </script>
</body>

</html>
