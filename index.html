<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071526">
    <title>event 19/11</title>
    <link rel="icon" type="image/png" href="icon.ico">
    <style>
        :root {
            --gold: #f6cd78;
            --cream: #fff6e5
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            width: 100%
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            overflow-x: hidden;
            overflow-y: auto;
            display: grid;
            place-items: center;
            padding: clamp(16px, 4vh, 36px) 20px;
            color: var(--cream);
            font-family: Arial, Helvetica, sans-serif;
            background: #b30000;
            transition: background 1.5s ease
        }

        .scene-bg {
            position: fixed;
            inset: 0;
            top: -100%;
            z-index: 0;
            background: #050c16 url("./background.svg") center/cover no-repeat;
            transition: top 1.5s cubic-bezier(.65, 0, .35, 1)
        }

        body.revealed {
            background: #050c16
        }

        body.revealed .scene-bg {
            top: 0
        }

        .stars {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease .4s;
            background-image: radial-gradient(1px 1px at 15% 20%, #fff 98%, transparent), radial-gradient(2px 2px at 78% 25%, #f6cd78 98%, transparent), radial-gradient(1px 1px at 63% 75%, #fff 98%, transparent), radial-gradient(1px 1px at 30% 82%, #d5e5ff 98%, transparent), radial-gradient(2px 2px at 90% 63%, #fff 98%, transparent);
            background-size: 310px 290px
        }

        body.revealed .stars {
            opacity: .55
        }

        .glow {
            position: fixed;
            z-index: 1;
            width: min(70vw, 650px);
            aspect-ratio: 1;
            border-radius: 50%;
            background: #d99c3c;
            filter: blur(140px);
            opacity: 0;
            transition: opacity 1.2s ease .5s;
            pointer-events: none
        }

        body.revealed .glow {
            opacity: .11
        }

        .photo-wall {
            position: fixed;
            inset: 0;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease .35s
        }

        .revealed .photo-wall {
            opacity: 1
        }

        .photo-column {
            position: absolute;
            top: 0;
            bottom: 0;
            width: var(--tile-w);
        }

        .photo-tile {
            position: absolute;
            left: 0;
            width: 100%;
            height: var(--tile-h);
            border: 1px solid #102f46;
            border-radius: 17px;
            background: #ffffff24;
            overflow: hidden;
            box-shadow: 0 3px 14px #0002
        }

        .photo-tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block
        }

        canvas {
            position: fixed;
            inset: 0;
            z-index: 3;
            width: 100%;
            height: 100%;
            pointer-events: none
        }

        main {
            position: relative;
            z-index: 2;
            width: min(680px, 100%);
            text-align: center;
            padding: clamp(28px, 5vh, 52px) clamp(20px, 6vw, 64px);
            border: 1px solid #f6cd783d;
            border-radius: 28px;
            background: linear-gradient(145deg, #152b40b8, #0c1a29c9);
            box-shadow: 0 24px 90px #0008, inset 0 1px #ffffff12;
            backdrop-filter: blur(12px);
            opacity: 0;
            visibility: hidden;
            transform: translateY(24px) scale(.97);
            transition: opacity 1.1s ease .65s, transform 1.2s cubic-bezier(.16, 1, .3, 1) .65s, visibility 0s linear 1.75s
        }

        body.revealed main {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            transition-delay: .65s, .65s, 0s
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            border: 1px solid #f6cd7855;
            border-radius: 999px;
            padding: 9px 15px;
            color: var(--gold);
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase
        }

        .symbol {
            margin: 30px auto 20px;
            width: 92px;
            height: 92px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            border: 1px solid #f6cd7870;
            background: radial-gradient(circle, #f6cd7820, #f6cd7805 70%);
            color: var(--gold);
            box-shadow: 0 0 38px #f6cd781c
        }

        .symbol svg {
            width: 48px;
            height: 48px
        }

        h1 {
            margin: 0;
            font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
            font-weight: 700;
            font-size: clamp(34px, 6vw, 54px);
            line-height: 1.12;
            letter-spacing: 0
        }

        h1 span {
            display: block;
            color: var(--gold)
        }

        .message {
            max-width: 490px;
            margin: 22px auto 0;
            color: #d2dce7;
            font-size: clamp(15px, 2.6vw, 18px);
            line-height: 1.8
        }

        .divider {
            width: 70px;
            height: 1px;
            margin: 28px auto 22px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent)
        }

        .signature-line {
            margin-top: 27px;
            color: #b9c7d8;
            font-size: 15px;
            line-height: 1.6
        }

        .signature {
            margin-top: 18px;
            color: #91a4b8;
            font-size: 12px;
            letter-spacing: 1px
        }

        .signature strong {
            color: var(--gold);
            font-weight: 500
        }

        @media(max-width:600px) {
            .photo-tile {
                border-radius: 12px
            }
body {
                place-items: start center;
                padding: 18px 14px
            }

            main {
                width: 100%;
                padding: 30px 22px;
                border-radius: 22px
            }

            .badge {
                font-size: 10px;
                letter-spacing: 1.5px;
                padding: 8px 12px
            }

            .symbol {
                width: 72px;
                height: 72px;
                margin: 22px auto 18px
            }

            .symbol svg {
                width: 40px;
                height: 40px
            }

            h1 {
                font-size: clamp(32px, 9vw, 44px)
            }

            .message {
                font-size: 16px;
                line-height: 1.65;
                margin-top: 18px
            }

            .divider {
                margin: 22px auto 18px
            }

            .signature-line {
                margin-top: 20px;
                font-size: 14px
            }

            .signature {
                font-size: 11px;
                line-height: 1.7;
                margin-top: 14px
            }
        }

        @media(max-height:650px) and (min-width:601px) {
            body {
                place-items: start center
            }

            main {
                padding-top: 26px;
                padding-bottom: 26px
            }

            .symbol {
                margin: 16px auto 12px
            }

            .divider {
                margin: 18px auto 14px
            }

            .signature-line {
                margin-top: 16px
            }

            .signature {
                margin-top: 10px
            }
        }

        @media(prefers-reduced-motion:reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important
            }
        }
    </style>
</head>

<body>
    <div class="scene-bg" aria-hidden="true"></div>
    <div id="photo-wall" class="photo-wall" aria-hidden="true"></div>
<div class="stars" aria-hidden="true"></div>
    <div class="glow" aria-hidden="true"></div><canvas id="confetti" aria-hidden="true"></canvas>
    <main>
        <div class="badge">✦ &nbsp; 19 tháng 11 &nbsp; ✦</div>
        <div class="symbol" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor"
                stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="20" cy="28" r="12" />
                <path d="M28.5 19.5 40 8m-9 0h9v9" />
            </svg></div>
        <h1>Ngày Quốc tế<span>Nam giới</span></h1>
        <p class="message">Chúc những người đàn ông luôn mạnh khỏe, bình an, tự tin theo đuổi điều mình yêu và nhận được
            thật nhiều yêu thương mỗi ngày.</p>
        <div class="divider"></div>
        <div class="signature-line">Hôm nay là dịp để nói lời cảm ơn và trân trọng bạn.</div>
        <div class="signature">Gửi lời chúc chân thành đến <strong>một nửa tuyệt vời của thế giới</strong></div>
    </main>
    <script>
        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d', { alpha: true });
        const photoWall = document.getElementById('photo-wall');
        let width = 0, height = 0, particles = [], celebrating = false;
        let photoFiles = [], photoPool = [], photoColumns = [], animationTimer = null;

        function isPhoneLayout() {
            return innerWidth <= 600 || (matchMedia('(pointer: coarse)').matches && Math.min(innerWidth, innerHeight) <= 600);
        }

        function resizeCanvas() {
            const mobile = isPhoneLayout();
            const dpr = Math.min(devicePixelRatio || 1, mobile ? 1.35 : 2);
            width = innerWidth;
            height = innerHeight;
            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        addEventListener('resize', resizeCanvas, { passive: true });
        resizeCanvas();

        function randomItem(items) {
            return items.length ? items[Math.floor(Math.random() * items.length)] : null;
        }

        function shuffle(items) {
            const result = items.slice();
            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }
            return result;
        }

        function setTilePhoto(tile, item) {
            tile.replaceChildren();
            tile._photoItem = item;
            if (!item) return;
            const img = document.createElement('img');
            img.alt = '';
            img.loading = 'lazy';
            img.decoding = 'async';
            img.fetchPriority = 'low';
            img.src = item.src;
            img.onerror = () => img.remove();
            tile.appendChild(img);
        }

        function getLayout() {
            const mobile = isPhoneLayout();
            const landscapePhone = mobile && innerWidth > innerHeight;
            const columns = mobile ? (landscapePhone ? 4 : 3) : 6;
            const cellWidth = width / columns;
            const tileWidth = Math.max(70, Math.floor(cellWidth * 0.76));
            const tileHeight = Math.max(105, Math.min(Math.floor(height * 0.19), Math.floor(tileWidth * 1.38)));
            return { mobile, columns, cellWidth, tileWidth, tileHeight, step: tileHeight + 12 };
        }

        function buildPhotoWall() {
            const layout = getLayout();
            photoWall.replaceChildren();
            photoColumns = [];
            document.documentElement.style.setProperty('--tile-w', `${layout.tileWidth}px`);
            document.documentElement.style.setProperty('--tile-h', `${layout.tileHeight}px`);

            for (let columnIndex = 0; columnIndex < layout.columns; columnIndex++) {
                const column = document.createElement('div');
                column.className = 'photo-column';
                column.style.left = `${columnIndex * layout.cellWidth + (layout.cellWidth - layout.tileWidth) / 2}px`;
                const direction = columnIndex % 2 === 0 ? -1 : 1;
                const tiles = [];
                const slotCount = Math.ceil(height / layout.step) + 2;
                for (let slot = 0; slot < slotCount; slot++) {
                    const tile = document.createElement('div');
                    tile.className = 'photo-tile';
                    const y = slot * layout.step - layout.step;
                    tile.style.top = '0px';
                    tile.style.transform = `translate3d(0,${y}px,0)`;
                    const photo = photoPool.length ? photoPool[(columnIndex + slot) % photoPool.length] : null;
                    setTilePhoto(tile, photo);
                    column.appendChild(tile);
                    tiles.push({ element: tile, y });
                }
                photoWall.appendChild(column);
                photoColumns.push({ tiles, direction, step: layout.step, tileHeight: layout.tileHeight, cursor: columnIndex });
            }
        }

        function replaceTile(tile, column) {
            if (!photoPool.length) return;
            const item = photoPool[column.cursor % photoPool.length];
            column.cursor++;
            setTilePhoto(tile, item);
        }

        function advancePhotoWall() {
            for (const column of photoColumns) {
                for (const tile of column.tiles) {
                    tile.y += column.direction * 0.8;
                    if (tile.y < -column.tileHeight - 4) {
                        tile.y += column.tiles.length * column.step;
                        replaceTile(tile.element, column);
                    } else if (tile.y > height + 4) {
                        tile.y -= column.tiles.length * column.step;
                        replaceTile(tile.element, column);
                    }
                    tile.element.style.transform = `translate3d(0,${tile.y}px,0)`;
                }
            }
        }

        function beginPhotoMotion() {
            if (animationTimer) clearInterval(animationTimer);
            const mobile = isPhoneLayout();
            animationTimer = setInterval(advancePhotoWall, mobile ? 90 : 55);
        }

        let resizeTimer;
        addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                resizeCanvas();
                buildPhotoWall();
                beginPhotoMotion();
            }, 180);
        }, { passive: true });

        async function cacheWithWorker(urls) {
            if (!('serviceWorker' in navigator)) return 0;
            const registration = await navigator.serviceWorker.ready;
            const worker = navigator.serviceWorker.controller || registration.active;
            if (!worker) return 0;
            return new Promise(resolve => {
                const channel = new MessageChannel();
                const timeout = setTimeout(() => { channel.port1.close(); resolve(0); }, 25000);
                channel.port1.onmessage = event => {
                    clearTimeout(timeout);
                    resolve(event.data?.cached || 0);
                    channel.port1.close();
                };
                worker.postMessage({ type: 'CACHE_PHOTOS', urls }, [channel.port2]);
            });
        }

        async function warmImages(urls) {
            let next = 0, loaded = 0;
            async function worker() {
                while (next < urls.length) {
                    const url = urls[next++];
                    await new Promise(resolve => {
                        const img = new Image();
                        img.onload = () => { loaded++; resolve(); };
                        img.onerror = resolve;
                        img.src = url;
                    });
                }
            }
            await Promise.all([worker(), worker()]);
            return loaded;
        }

        async function prepareOfflineSupport(urls) {
            try {
                if (!('serviceWorker' in navigator)) return await warmImages(urls);
                await navigator.serviceWorker.register('./service-worker.js');
                await navigator.serviceWorker.ready;
                if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
                let cached = await cacheWithWorker(urls.map(item => new URL(item.src, location.href).href));
                if (cached < urls.length) cached = Math.max(cached, await warmImages(urls.map(item => item.src)));
                return cached;
            } catch (error) {
                return await warmImages(urls.map(item => item.src));
            }
        }

        async function loadLocalImageManifest() {
            try {
                const response = await fetch('./images.json');
                if (!response.ok) throw new Error('images.json not found');
                const manifest = await response.json();
                photoFiles = (manifest.images || [])
                    .filter(path => typeof path === 'string' && /\.(jpg|jpeg|png|webp)$/i.test(path))
                    .map(path => ({ src: './' + path.split('/').map(encodeURIComponent).join('/') }));

                const savedPool = JSON.parse(localStorage.getItem('event-photo-pool') || '[]');
                const previousPool = savedPool.filter(src => photoFiles.some(photo => photo.src === src)).map(src => ({ src }));
                const newPool = shuffle(photoFiles).slice(0, 8);
                let cached = 0;
                try {
                    if ('serviceWorker' in navigator) {
                        await navigator.serviceWorker.register('./service-worker.js');
                        await navigator.serviceWorker.ready;
                        if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
                        cached = await cacheWithWorker(newPool.map(item => new URL(item.src, location.href).href));
                    }
                } catch (_) { }

                if (cached === newPool.length) {
                    photoPool = newPool;
                    localStorage.setItem('event-photo-pool', JSON.stringify(photoPool.map(item => item.src)));
                } else if (previousPool.length) {
                    photoPool = previousPool.slice(0, 8);
                } else {
                    photoPool = newPool;
                    await prepareOfflineSupport(photoPool);
                    localStorage.setItem('event-photo-pool', JSON.stringify(photoPool.map(item => item.src)));
                }
                buildPhotoWall();
                beginPhotoMotion();
            } catch (error) {
                console.warn('Could not prepare photo resources.', error);
                buildPhotoWall();
                beginPhotoMotion();
            }
        }

        function startCelebration() {
            if (celebrating) return;
            celebrating = true;
            const count = innerWidth <= 600 ? 28 : 72;
            particles = Array.from({ length: count }, () => ({
                x: Math.random() * width, y: -Math.random() * height,
                radius: 2 + Math.random() * 2.5, speed: 1 + Math.random() * 2,
                angle: Math.random() * 6.28,
                color: ['#f6cd78', '#fff1c7', '#8db7d9'][Math.floor(Math.random() * 3)]
            }));
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, width, height);
            if (celebrating) {
                for (const particle of particles) {
                    particle.y += particle.speed;
                    particle.x += Math.sin(particle.y / 35) * 0.45;
                    particle.angle += 0.03;
                    ctx.fillStyle = particle.color;
                    ctx.globalAlpha = 0.78;
                    ctx.beginPath();
                    ctx.ellipse(particle.x, particle.y, particle.radius, particle.radius * 0.55, particle.angle, 0, Math.PI * 2);
                    ctx.fill();
                    if (particle.y > height + 10) { particle.y = -10; particle.x = Math.random() * width; }
                }
                ctx.globalAlpha = 1;
            }
            requestAnimationFrame(animateConfetti);
        }

        loadLocalImageManifest();
        animateConfetti();
        setTimeout(() => { document.body.classList.add('revealed'); startCelebration(); }, 1000);
    </script>
</body>

</html>
