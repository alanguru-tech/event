<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071526">
    <title>event 19/11</title>
    <link rel="icon" href="./icon.ico?v=2" type="image/x-icon" sizes="any">
    <link rel="alternate icon" href="./icon.png?v=2" type="image/png">
    <style>
        :root {
            --gold: #f6cd78;
            --cream: #fff6e5
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            width: 100%
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            overflow-x: hidden;
            overflow-y: auto;
            display: grid;
            place-items: center;
            padding: clamp(16px, 4vh, 36px) 20px;
            color: var(--cream);
            font-family: Arial, Helvetica, sans-serif;
            background: #050c16;
        }

        .universe-background { position: fixed; inset: 0; z-index: 0; display: block; width: 100%; height: 100%; border: 0; pointer-events: none }

        .scene-bg {
            position: fixed;
            inset: 0;
            top: -100%;
            z-index: 0;
            background: #050c16 url("./background.svg") center/100% 100% no-repeat;
            transition: top 1.5s cubic-bezier(.65, 0, .35, 1);
            display: none
        }

        body.revealed {
            background: #050c16
        }

        body.revealed .scene-bg {
            top: 0
        }

        .stars {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease .4s;
            background-image: radial-gradient(1px 1px at 15% 20%, #fff 98%, transparent), radial-gradient(2px 2px at 78% 25%, #f6cd78 98%, transparent), radial-gradient(1px 1px at 63% 75%, #fff 98%, transparent), radial-gradient(1px 1px at 30% 82%, #d5e5ff 98%, transparent), radial-gradient(2px 2px at 90% 63%, #fff 98%, transparent);
            background-size: 310px 290px;
            display: none
        }

        body.revealed .stars {
            opacity: .55
        }

        .glow {
            position: fixed;
            z-index: 1;
            width: min(70vw, 650px);
            aspect-ratio: 1;
            border-radius: 50%;
            background: #d99c3c;
            filter: blur(140px);
            opacity: 0;
            transition: opacity 1.2s ease .5s;
            pointer-events: none;
            display: none
        }

        body.revealed .glow {
            opacity: .11
        }

        .photo-wall {
            position: fixed;
            inset: 0;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease .35s;
            perspective: 1350px;
            perspective-origin: 50% 50%;
            transform-style: preserve-3d;
            display: none
        }

        .revealed .photo-wall {
            opacity: 1
        }

        .photo-wall::before,
        .photo-wall::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(52vmin, 520px);
            aspect-ratio: 1;
            border: 1px solid #d5b8753b;
            border-radius: 50%;
            transform-style: preserve-3d;
            box-shadow: 0 0 20px #eab96810, inset 0 0 18px #eab96808
        }

        .photo-wall::before {
            width: min(78vmin, 760px);
            border-color: #99b9f326;
            transform: translate(-50%, -50%) rotateX(calc(61deg + var(--orbit-pitch, 0deg))) rotateY(var(--orbit-yaw, 0deg)) rotateZ(-14deg)
        }

        .photo-wall::after {
            transform: translate(-50%, -50%) rotateX(calc(70deg + var(--orbit-pitch, 0deg))) rotateY(var(--orbit-yaw, 0deg)) rotateZ(22deg)
        }

        .photo-tile {
            position: absolute;
            left: 50%;
            top: 50%;
            border: 1px solid #d6e5ffb0;
            border-radius: 12px;
            background: #10182a;
            overflow: hidden;
            box-shadow: 0 8px 26px #0009, 0 0 16px #a8c9ff32;
            transform-style: preserve-3d;
            backface-visibility: hidden;
            will-change: transform
        }

        .photo-tile img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            user-select: none;
            -webkit-user-drag: none
        }

        .photo-tile.orbit-fallback {
            border-color: #ffffff52;
            background:
                radial-gradient(ellipse at 68% 28%, #ffdfb766 0 9%, transparent 10%),
                radial-gradient(ellipse at 29% 82%, #b6a7e455 0 24%, transparent 25%),
                linear-gradient(145deg, var(--tile-tint, #425780), #0b1222 76%)
        }
        canvas {
            position: fixed;
            inset: 0;
            z-index: 3;
            width: 100%;
            height: 100%;
            pointer-events: none
        }

        main {
            position: relative;
            z-index: 2;
            width: min(620px, calc(100vw - 32px));
            text-align: center;
            padding: clamp(26px, 4.5vh, 42px) clamp(20px, 5vw, 54px);
            border: 1px solid #f6cd783d;
            border-radius: 28px;
            background: linear-gradient(145deg, #152b40b8, #0c1a29c9);
            box-shadow: 0 24px 90px #0008, inset 0 1px #ffffff12;
            backdrop-filter: blur(12px);
            opacity: 0;
            visibility: hidden;
            transform: translateY(24px) scale(.97);
            transition: opacity 1.1s ease .65s, transform 1.2s cubic-bezier(.16, 1, .3, 1) .65s, visibility 0s linear 1.75s
        }

        body.revealed main {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            transition-delay: .65s, .65s, 0s
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            border: 1px solid #f6cd7855;
            border-radius: 999px;
            padding: 9px 15px;
            color: var(--gold);
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase
        }

        h1 {
            margin: 0;
            font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
            font-weight: 700;
            font-size: clamp(30px, 5vw, 48px);
            line-height: 1.12;
            letter-spacing: 0;
            overflow-wrap: anywhere
        }

        h1 span {
            display: block;
            color: var(--gold)
        }

        .message {
            max-width: 490px;
            margin: 22px auto 0;
            color: #d2dce7;
            font-size: clamp(15px, 2.6vw, 18px);
            line-height: 1.8
        }

        .divider {
            width: 70px;
            height: 1px;
            margin: 28px auto 22px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent)
        }

        .signature-line {
            margin-top: 27px;
            color: #b9c7d8;
            font-size: 15px;
            line-height: 1.6
        }

        .signature {
            margin-top: 18px;
            color: #91a4b8;
            font-size: 12px;
            letter-spacing: 1px
        }

        .signature strong {
            color: var(--gold);
            font-weight: 500
        }

        .person-photo-wrap {
            width: min(180px, 42vw);
            margin: 18px auto 12px
        }

        .person-photo {
            display: block;
            width: 100%;
            max-height: 210px;
            aspect-ratio: 4 / 5;
            object-fit: cover;
            border-radius: 18px;
            border: 1px solid #f6cd7855;
            box-shadow: 0 12px 32px #0005
        }

        @media(max-width:600px) {
            .photo-tile {
                border-radius: 9px
            }
body {
                place-items: start center;
                padding: 18px 14px
            }

            main {
                width: 100%;
                padding: 26px 18px;
                border-radius: 22px
            }

            .badge {
                font-size: 10px;
                letter-spacing: 1.5px;
                padding: 8px 12px
            }

            h1 {
                font-size: clamp(29px, 8vw, 39px)
            }

            .person-photo-wrap { width: min(150px, 42vw); margin: 14px auto 10px }
            .person-photo { max-height: 180px; border-radius: 15px }

            .message {
                font-size: 16px;
                line-height: 1.65;
                margin-top: 18px
            }

            .divider {
                margin: 22px auto 18px
            }

            .signature-line {
                margin-top: 20px;
                font-size: 14px
            }

            .signature {
                font-size: 11px;
                line-height: 1.7;
                margin-top: 14px
            }
        }

        @media(max-height:650px) and (min-width:601px) {
            body {
                place-items: start center
            }

            main {
                padding-top: 26px;
                padding-bottom: 26px
            }

            .divider {
                margin: 18px auto 14px
            }

            .signature-line {
                margin-top: 16px
            }

            .signature {
                margin-top: 10px
            }
        }

        @media(max-width:600px) {
            .photo-wall::before { width: 100vmin; }
            .photo-wall::after { width: 66vmin; }
        }

        body.personal-view .person-photo-wrap {
            width: fit-content;
            max-width: 100%;
            margin: 18px auto 8px
        }

        body.personal-view .person-photo-wrap[hidden] { display: none }

        body.personal-view .person-photo {
            display: block;
            width: auto;
            height: auto;
            max-width: min(100%, 380px);
            max-height: 34vh;
            aspect-ratio: auto;
            object-fit: contain
        }

        @media(prefers-reduced-motion:reduce) {
            .photo-tile { will-change: auto; }

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important
            }
        }
    </style>
</head>

<body>

<div class="stars" aria-hidden="true"></div>

    <main>
        <div class="badge">✦ &nbsp; 19 tháng 11 &nbsp; ✦</div>

            <img id="person-photo" class="person-photo" alt="Ảnh người nhận lời chúc">

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAL8w7SsKAmjF9_Am_RMXCtldk08Daj5Kk",
            authDomain: "event-896c1.firebaseapp.com",
            projectId: "event-896c1",
            storageBucket: "event-896c1.firebasestorage.app",
            messagingSenderId: "717683458969",
            appId: "1:717683458969:web:d60444a971f66e4cb20908"
        };

        async function loadPersonalGreeting() {
            const code = new URLSearchParams(location.search).get('id');
            if (!code) return;
            document.body.classList.add('personal-view');
            if (!/^[a-f0-9]{32}$/.test(code)) {
                showGreetingError('Mã QR không hợp lệ. Vui lòng quét lại mã được gửi cho bạn.');
                return;
            }
            try {
                const [{ initializeApp }, { getFirestore, doc, getDoc }] = await Promise.all([
                    import('https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js'),
                    import('https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js')
                ]);
                const app = initializeApp(firebaseConfig);
                const snapshot = await getDoc(doc(getFirestore(app), 'greetings', code));
                if (!snapshot.exists()) {
                    showGreetingError('Không tìm thấy lời chúc cho mã QR này. Vui lòng liên hệ người gửi.');
                    return;
                }
                const person = snapshot.data();
                document.getElementById('greeting-title').innerHTML = `Ngày Quốc tế<span>${escapeHtml(person.name || 'Nam giới')}</span>`;
                const recipientName = person.name || 'bạn';
                document.getElementById('greeting-message').textContent = (person.message || 'Chúc bạn luôn mạnh khỏe, bình an, tự tin theo đuổi điều mình yêu và nhận được thật nhiều yêu thương mỗi ngày.').replaceAll('{{name}}', recipientName);
                document.getElementById('greeting-extra').textContent = (person.extra || 'Hôm nay là dịp để nói lời cảm ơn và trân trọng bạn.').replaceAll('{{name}}', recipientName);
                if (person.photoPath && isGitImagePath(person.photoPath)) {
                    const photo = document.getElementById('person-photo');
                    const photoWrap = document.getElementById('person-photo-wrap');
                    photo.onload = () => { photoWrap.hidden = false; };
                    photo.onerror = () => {
                        photoWrap.hidden = true;
                        showGreetingError(`Không tải được ảnh “${person.photoPath}”. Kiểm tra tệp này đã có trên GitHub Pages chưa.`);
                        console.warn('Không tìm thấy ảnh GitHub:', person.photoPath);
                    };
                    photo.src = './' + person.photoPath.split('/').map(encodeURIComponent).join('/');
                }
                if (person.title) document.querySelector('.badge').textContent = person.title;
                document.title = `Lời chúc dành cho ${person.name || 'bạn'}`;
            } catch (error) {
                console.error('Không tải được lời chúc cá nhân.', error);
                showGreetingError('Chưa kết nối được kho lời chúc. Hãy kiểm tra mạng rồi tải lại trang.');
            }
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
        }

        function showGreetingError(message) {
            const error = document.getElementById('greeting-error');
            error.textContent = message;
            error.hidden = false;
        }

        function isGitImagePath(path) {
            return typeof path === 'string' && /^images\/[^/\\?#]+\.(?:jpg|jpeg|png|webp)$/i.test(path) && !path.includes('..');
        }

        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d', { alpha: true });
        const photoWall = document.getElementById('photo-wall');
        let width = 0, height = 0, particles = [], celebrating = false;
        let photoFiles = [], photoPool = [], orbitCards = [], currentColumnCount = 0, serviceWorkerRegistration = null;

        function isPhoneLayout() {
            return innerWidth <= 600 || (matchMedia('(pointer: coarse)').matches && Math.min(innerWidth, innerHeight) <= 600);
        }

        function resizeCanvas() {
            const mobile = isPhoneLayout();
            const dpr = Math.min(devicePixelRatio || 1, mobile ? 1.35 : 2);
            width = innerWidth;
            height = innerHeight;
            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        addEventListener('resize', resizeCanvas, { passive: true });
        resizeCanvas();

        function shuffle(items) {
            const result = items.slice();
            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }
            return result;
        }

        function shuffleForQr(items, code) {
            if (!code || !/^[a-f0-9]{32}$/i.test(code)) return shuffle(items);
            let seed = 2166136261;
            for (const char of code) seed = Math.imul(seed ^ char.charCodeAt(0), 16777619) >>> 0;
            const random = () => {
                seed += 0x6D2B79F5;
                let value = seed;
                value = Math.imul(value ^ value >>> 15, value | 1);
                value ^= value + Math.imul(value ^ value >>> 7, value | 61);
                return ((value ^ value >>> 14) >>> 0) / 4294967296;
            };
            const result = items.slice();
            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(random() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }
            return result;
        }

        function getLayout() {
            const phone = isPhoneLayout();
            const columns = phone ? (innerWidth > innerHeight ? 4 : 3) : 6;
            const tileWidth = Math.max(54, Math.min(118, Math.floor(Math.min(width, height) * (phone ? 0.14 : 0.105))));
            return { phone, columns, tileWidth };
        }

        function getOrbitLayers(phone) {
            return phone ? [
                { radius: .22, count: 4, speed: .00021, tiltX: 66, tiltY: -12, phase: .3 },
                { radius: .37, count: 5, speed: -.000146, tiltX: 49, tiltY: 25, phase: 1.2 },
                { radius: .51, count: 6, speed: .000094, tiltX: 72, tiltY: -28, phase: 2.0 }
            ] : [
                { radius: .23, count: 5, speed: .00021, tiltX: 66, tiltY: -12, phase: .3 },
                { radius: .38, count: 7, speed: -.000146, tiltX: 49, tiltY: 25, phase: 1.2 },
                { radius: .52, count: 9, speed: .000094, tiltX: 72, tiltY: -28, phase: 2.0 }
            ];
        }

        function makeOrbitTile(photo, layout, index) {
            const tile = document.createElement('div');
            tile.className = 'photo-tile';
            tile.style.width = `${layout.tileWidth}px`;
            tile.style.aspectRatio = photo ? `${photo.width} / ${photo.height}` : '1.18';
            if (!photo) {
                tile.classList.add('orbit-fallback');
                tile.style.setProperty('--tile-tint', `hsl(${(index * 39 + 204) % 360} 48% 38%)`);
                return tile;
            }
            const img = document.createElement('img');
            img.alt = '';
            img.decoding = 'async';
            img.loading = 'lazy';
            img.fetchPriority = 'low';
            img.draggable = false;
            img.src = photo.src;
            img.onerror = () => {
                tile.replaceChildren();
                tile.classList.add('orbit-fallback');
                tile.style.setProperty('--tile-tint', `hsl(${(index * 39 + 204) % 360} 48% 38%)`);
            };
            tile.appendChild(img);
            return tile;
        }

        function buildPhotoWall() {
            const layout = getLayout();
            photoWall.replaceChildren();
            orbitCards = [];
            const layers = getOrbitLayers(layout.phone);
            let index = 0;
            for (let layerIndex = 0; layerIndex < layers.length; layerIndex++) {
                const layer = layers[layerIndex];
                for (let tileIndex = 0; tileIndex < layer.count; tileIndex++, index++) {
                    const photo = photoPool.length ? photoPool[index % photoPool.length] : null;
                    const tile = makeOrbitTile(photo, layout, index);
                    photoWall.appendChild(tile);
                    orbitCards.push({
                        element: tile, layer, layerIndex,
                        start: Math.PI * 2 * tileIndex / layer.count + layer.phase
                    });
                }
            }
            updateOrbitPositions(orbitElapsed);
            startOrbitAnimation();
        }

        let orbitElapsed = 0, orbitLastTime = 0, orbitFrameId = 0;
        const reduceOrbitMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

        function updateOrbitPositions(time) {
            const size = Math.min(width, height);
            if (!size || !orbitCards.length) return;
            const yaw = time * .00007;
            const yawCos = Math.cos(yaw), yawSin = Math.sin(yaw);
            const pitch = Math.sin(time * .00022) * .1;
            const pitchCos = Math.cos(pitch), pitchSin = Math.sin(pitch);
            photoWall.style.setProperty('--orbit-yaw', `${(yaw * 180 / Math.PI).toFixed(2)}deg`);
            photoWall.style.setProperty('--orbit-pitch', `${(pitch * 180 / Math.PI).toFixed(2)}deg`);

            for (const card of orbitCards) {
                const { layer, layerIndex, start, element } = card;
                const phase = start + time * layer.speed;
                const radius = size * layer.radius;
                const localX = radius * Math.cos(phase);
                const localY = radius * Math.sin(phase);
                const tiltX = layer.tiltX * Math.PI / 180;
                const tiltY = layer.tiltY * Math.PI / 180;

                const planeX = localX * Math.cos(tiltY) + localY * Math.sin(tiltX) * Math.sin(tiltY);
                const planeY = localY * Math.cos(tiltX);
                const planeZ = -localX * Math.sin(tiltY) + localY * Math.sin(tiltX) * Math.cos(tiltY);
                const worldX = planeX * yawCos + planeZ * yawSin;
                const worldZ = -planeX * yawSin + planeZ * yawCos;
                const screenY = planeY * pitchCos - worldZ * pitchSin;
                const depthZ = planeY * pitchSin + worldZ * pitchCos;
                const tangent = phase + Math.PI / 2;
                const tiltCardX = Math.sin(tangent) * 10;
                const tiltCardY = -Math.cos(tangent) * 12;

                element.style.transform = `translate3d(calc(-50% + ${worldX.toFixed(1)}px), calc(-50% + ${screenY.toFixed(1)}px), ${depthZ.toFixed(1)}px) rotateX(${tiltCardX.toFixed(1)}deg) rotateY(${tiltCardY.toFixed(1)}deg)`;
                element.style.zIndex = String(1000 + layerIndex * 10 + Math.round(depthZ));
            }
        }

        function animateOrbit(time) {
            orbitFrameId = 0;
            if (document.hidden || photoWall.hidden || !orbitCards.length || reduceOrbitMotion) return;
            if (orbitLastTime && time - orbitLastTime < (isPhoneLayout() ? 42 : 33)) {
                orbitFrameId = requestAnimationFrame(animateOrbit);
                return;
            }
            const elapsed = orbitLastTime ? Math.min(time - orbitLastTime, 50) : 16;
            orbitLastTime = time;
            orbitElapsed += elapsed;
            updateOrbitPositions(orbitElapsed);
            orbitFrameId = requestAnimationFrame(animateOrbit);
        }

        function startOrbitAnimation() {
            if (reduceOrbitMotion) { updateOrbitPositions(0); return; }
            if (!orbitFrameId && !document.hidden && !photoWall.hidden && orbitCards.length) {
                orbitFrameId = requestAnimationFrame(animateOrbit);
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (orbitFrameId) cancelAnimationFrame(orbitFrameId);
                orbitFrameId = 0;
            } else startOrbitAnimation();
        });

        async function getServiceWorker() {
            if (!('serviceWorker' in navigator)) return null;
            if (!serviceWorkerRegistration) {
                await navigator.serviceWorker.register('./service-worker.js');
                serviceWorkerRegistration = await navigator.serviceWorker.ready;
                if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
            }
            return navigator.serviceWorker.controller || serviceWorkerRegistration.active;
        }

        async function cacheWithWorker(urls) {
            const worker = await getServiceWorker();
            if (!worker) return 0;
            return new Promise(resolve => {
                const channel = new MessageChannel();
                const timeout = setTimeout(() => { channel.port1.close(); resolve(0); }, 90000);
                channel.port1.onmessage = event => {
                    clearTimeout(timeout);
                    resolve(event.data?.cached || 0);
                    channel.port1.close();
                };
                worker.postMessage({ type: 'CACHE_PHOTOS', urls }, [channel.port2]);
            });
        }

        function loadPhotoInfo(items) {
            let next = 0;
            const loaded = [];
            async function worker() {
                while (next < items.length) {
                    const item = items[next++];
                    const result = await new Promise(resolve => {
                        const image = new Image();
                        image.onload = () => resolve({ ...item, width: image.naturalWidth, height: image.naturalHeight });
                        image.onerror = () => resolve(null);
                        image.src = item.src;
                    });
                    if (result?.width && result?.height) loaded.push(result);
                }
            }
            const concurrency = isPhoneLayout() ? 2 : 4;
            return Promise.all(Array.from({ length: Math.min(concurrency, items.length) }, worker)).then(() => loaded);
        }

        let photoConfigVersion = 0;
        async function configureOrbitPhotos(columns) {
            const version = ++photoConfigVersion;
            currentColumnCount = columns;
            if (!photoFiles.length) { photoPool = []; buildPhotoWall(); return; }
            const phone = isPhoneLayout();
            const wanted = Math.min(photoFiles.length, phone ? 15 : 21);
            const qrCode = new URLSearchParams(location.search).get('id') || '';
            const cacheKey = qrCode && /^[a-f0-9]{32}$/i.test(qrCode) ? `event-photo-pool-${qrCode}` : 'event-photo-pool';
            let saved = [];
            try { saved = JSON.parse(localStorage.getItem(cacheKey) || '[]'); } catch (_) { }
            const previous = saved.filter(src => photoFiles.some(photo => photo.src === src)).map(src => ({ src }));
            const fresh = shuffleForQr(photoFiles, qrCode).slice(0, wanted);
            let freshCached = 0;
            try { freshCached = await cacheWithWorker(fresh.map(photo => new URL(photo.src, location.href).href)); } catch (_) { }
            let chosen = freshCached === fresh.length ? fresh : previous.length >= Math.min(wanted, fresh.length) ? previous.slice(0, wanted) : fresh;
            let measured = await loadPhotoInfo(chosen);
            if (version !== photoConfigVersion) return;
            if (measured.length < Math.min(wanted, 8) && previous.length && chosen !== previous) {
                const oldMeasured = await loadPhotoInfo(previous.slice(0, wanted));
                if (oldMeasured.length > measured.length) measured = oldMeasured;
            }
            if (version !== photoConfigVersion) return;
            if (!measured.length) { photoPool = []; buildPhotoWall(); return; }
            photoPool = measured;
            try { localStorage.setItem(cacheKey, JSON.stringify(photoPool.map(photo => photo.src))); } catch (_) { }
            buildPhotoWall();
        }

        async function loadLocalImageManifest() {
            try {
                const response = await fetch('./images.json');
                if (!response.ok) throw new Error('images.json not found');
                const manifest = await response.json();
                const manifestFiles = (manifest.images || [])
                    .filter(path => isGitImagePath(path))
                    .map(path => ({ src: './' + path.split('/').map(encodeURIComponent).join('/') }));
                photoFiles = manifestFiles;
                // Start from locally available sources first so Firestore/network delays don't hold up the scene.
                try {
                    const cachedPaths = JSON.parse(localStorage.getItem('event-orbit-paths') || '[]');
                    if (Array.isArray(cachedPaths) && cachedPaths.length) {
                        photoFiles = cachedPaths.filter(isGitImagePath).map(path => ({ src: './' + path.split('/').map(encodeURIComponent).join('/') }));
                    }
                } catch (_) { }
                configureOrbitPhotos(getLayout().columns).catch(error => {
                    console.warn('Could not prepare photo tracks.', error);
                    buildPhotoWall();
                });
                // The admin-managed orbit list is public image paths only; fetch this one settings document.
                try {
                    const [{ initializeApp }, { getFirestore, doc, getDoc }] = await Promise.all([
                        import('https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js'),
                        import('https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js')
                    ]);
                    const app = initializeApp(firebaseConfig, 'orbit-photo-settings');
                    const settings = await getDoc(doc(getFirestore(app), 'settings', 'orbitPhotos'));
                    const paths = settings.exists() && Array.isArray(settings.data().paths) ? settings.data().paths : [];
                    const safePaths = paths.filter(isGitImagePath);
                    if (safePaths.length) {
                        try { localStorage.setItem('event-orbit-paths', JSON.stringify(safePaths)); } catch (_) { }
                        photoFiles = safePaths.map(path => ({ src: './' + path.split('/').map(encodeURIComponent).join('/') }));
                    } else {
                        try { localStorage.removeItem('event-orbit-paths'); } catch (_) { }
                        photoFiles = manifestFiles;
                    }
                    configureOrbitPhotos(getLayout().columns).catch(error => console.warn('Could not apply Firestore orbit photos.', error));
                } catch (settingsError) {
                    console.info('Using the locally available orbit image list.', settingsError);
                }
            } catch (error) {
                console.warn('Could not prepare photo resources.', error);
                buildPhotoWall();
            }
        }

        let resizeTimer;
        addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                resizeCanvas();
                const columns = getLayout().columns;
                if (columns !== currentColumnCount && photoFiles.length) configureOrbitPhotos(columns);
                else buildPhotoWall();
            }, 220);
        }, { passive: true });

        function startCelebration() {
            if (celebrating) return;
            celebrating = true;
            const count = isPhoneLayout() ? 20 : 64;
            particles = Array.from({ length: count }, () => ({
                x: Math.random() * width, y: -Math.random() * height,
                radius: 1.5 + Math.random() * 2, speed: 1 + Math.random() * 1.8,
                angle: Math.random() * 6.28,
                color: ['#f6cd78', '#fff1c7', '#8db7d9'][Math.floor(Math.random() * 3)]
            }));
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, width, height);
            if (celebrating) {
                for (const particle of particles) {
                    particle.y += particle.speed;
                    particle.x += Math.sin(particle.y / 35) * 0.4;
                    particle.angle += 0.025;
                    ctx.fillStyle = particle.color;
                    ctx.globalAlpha = 0.75;
                    ctx.beginPath();
                    ctx.ellipse(particle.x, particle.y, particle.radius, particle.radius * 0.55, particle.angle, 0, Math.PI * 2);
                    ctx.fill();
                    if (particle.y > height + 10) { particle.y = -10; particle.x = Math.random() * width; }
                }
                ctx.globalAlpha = 1;
            }
            requestAnimationFrame(animateConfetti);
        }

        animateConfetti();
        const universeFrame = document.getElementById('universe-background');
        const universeId = new URLSearchParams(location.search).get('id');
        universeFrame.src = './preview-vu-tru-lo-den.html' + (universeId ? `?id=${encodeURIComponent(universeId)}` : '');
        document.body.classList.add('revealed');
        startCelebration();
        loadPersonalGreeting();
    </script>
</body>
